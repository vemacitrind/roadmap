<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Feature Carousel</title>

  <style>
    body {
      margin: 0;
      background: #0f0f0f;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: sans-serif;
    }

    .carousel {
      width: 90%;
      max-width: 900px;
      overflow: hidden;
      position: relative;
      border-radius: 12px;
    }

    .track {
      display: flex;
      transition: transform 0.5s ease-in-out;
    }

    .slide {
      min-width: 100%;
    }

    .slide img {
      width: 100%;
      display: block;
      border-radius: 12px;
    }

    .controls {
      position: absolute;
      top: 50%;
      width: 100%;
      display: flex;
      justify-content: space-between;
      transform: translateY(-50%);
    }

    button {
      background: rgba(0,0,0,0.6);
      border: none;
      color: white;
      font-size: 24px;
      padding: 10px 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="carousel">
    <div class="track" id="track">
      <div class="slide"><img src="https://github.com/user-attachments/assets/3563ce7c-6885-4571-b4a2-ed6232f07675"></div>
      <div class="slide"><img src="https://github.com/user-attachments/assets/2a8672dd-dfca-4dd9-8839-2b98286c5d16"></div>
      <div class="slide"><img src="https://github.com/user-attachments/assets/557c432c-fd84-4218-8e8e-de649669aa17"></div>
      <div class="slide"><img src="https://github.com/user-attachments/assets/7afa957f-e785-4871-85ce-b20e9d83f22b"></div>
      <div class="slide"><img src="https://github.com/user-attachments/assets/7628a9d0-b31b-4f84-ba40-f8e37f33a8f6"></div>
      <div class="slide"><img src="https://github.com/user-attachments/assets/6beac90a-ac9d-4afe-857f-c158b1a9cc73"></div>
      <div class="slide"><img src="https://github.com/user-attachments/assets/ec2cae53-bcb4-4627-9cb0-f31bcc6dea3d"></div>
      <div class="slide"><img src="https://github.com/user-attachments/assets/8ebc859c-1848-48c3-801a-8ff9b7316f88"></div>
    </div>

    <div class="controls">
      <button onclick="prev()">❮</button>
      <button onclick="next()">❯</button>
    </div>
  </div>

  <script>
    let index = 0;
    const track = document.getElementById('track');
    const slides = document.querySelectorAll('.slide');

    function update() {
      track.style.transform = `translateX(-${index * 100}%)`;
    }

    function next() {
      index = (index + 1) % slides.length;
      update();
    }

    function prev() {
      index = (index - 1 + slides.length) % slides.length;
      update();
    }
  </script>

</body>
</html>
