version: '3.9'

services:
  django:
    image: python:3.12-slim
    container_name: django_server
    command: python manage.py runserver 0.0.0.0:5000
    volumes:
      - .:/app
    working_dir: /app
    ports:
      - "5000:5000"
    depends_on:
      - code_runner
    environment:
      - PYTHONUNBUFFERED=1

  code_runner:
    build:
      context: ./dockerfiles
    container_name: code_runner
    volumes:
      - ./tmp:/app
